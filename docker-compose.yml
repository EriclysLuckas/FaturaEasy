version: "3.9"

services:
  database:
    image: postgres:15
    container_name: anotei_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anotei_financas

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: anotei_api
    restart: always

    ports:
    - "3333:3333"

    depends_on:
    - database

    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/anotei_financas?schema=public

    volumes:
    - .:/app
    - /app/node_modules
volumes:
  postgres_data:
  api:
  