version: "3.9"

services:
  api:
    build: .
    container_name: anotei_api
    restart: always

    ports:
      - "3333:3333"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/anotei_financas

    depends_on:
      - database

    volumes:
      - .:/app
      - /app/node_modules


  database:
    image: postgres:15

    container_name: anotei_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anotei_financas

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: